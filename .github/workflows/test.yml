name: Test

on: # yamllint disable-line rule:truthy
  push:
    branches: [main, alpha]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  unit:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        name: Setup pnpm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.2
        name: Setup Node.js
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm test:coverage
        name: Run tests with coverage

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        name: Upload coverage to Codecov
        with:
          use_oidc: true

      - uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        with:
          use_oidc: true
          files: '**/test-report.junit.xml'

  storybook:
    name: Run Storybook interaction tests
    runs-on: ubuntu-latest
    # container:
    #   # Use the Playwright image if you need cross-browser testing beyond chromium.
    #   # https://playwright.dev/docs/docker#pull-the-image
    #   image: mcr.microsoft.com/playwright:v1.54.1-noble
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        name: Setup pnpm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.2
        name: Setup Node.js
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm exec playwright install chromium --with-deps
        name: Install Playwright

      - run: pnpm test:storybook
        name: Run Storybook tests

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        name: Upload coverage to Codecov
        with:
          use_oidc: true

      - uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        with:
          use_oidc: true
          files: '**/test-report.junit.xml'

  interaction-and-accessibility:
    name: Test Interactions and Accessibility
    runs-on: ubuntu-latest
    container:
      # Make sure to grab the latest version of the Playwright image.
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.54.1-noble
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        name: Setup pnpm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.2
        name: Setup Node.js
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm test:storybook
        name: Run interaction and accessibility tests

  user-flow:
    name: Test User Flow
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # https://github.com/cypress-io/github-action/issues/48
      matrix:
        containers: [1, 2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        name: Setup pnpm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.2
        name: Setup Node.js
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - uses: cypress-io/github-action@1052aa98bbbe4f55210f844878213c07d9c8c399 # v6.7.13
        name: Cypress run
        with:
          start: pnpm dev
          wait-on: "http://localhost:5173"
          record: true
          parallel: true
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chromatic:
    name: Publish Storybook to Chromatic
    if: ${{ hashFiles('chromatic.config.json', 'chromatic.config.ts', 'chromatic.config.js') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        name: Setup pnpm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.2
        name: Setup Node.js
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - uses: chromaui/action@v13
        name: Publish to Chromatic
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          buildScriptName: build:storybook
