name: Audit

on: # yamllint disable-line rule:truthy
  push:
    branches: [main, alpha]
  pull_request:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle-size:
    name: Audit the bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: audit-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        name: Setup pnpm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.2
        name: Setup Node.js
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: pnpm build
        name: Build and upload bundle stats
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  performance:
    name: Audit the performance
    if: ${{ hashFiles('lighthouse.config.js', 'lighthouse.config.cjs', 'lighthouse.config.json', '.lighthouserc.js', '.lighthouserc.cjs', '.lighthouserc.json', '.lighthouserc.yml', '.lighthouserc.yaml') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: performance-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout repository

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        name: Setup pnpm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.2
        name: Setup Node.js
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        name: Install dependencies

      - run: npm install -g @lhci/cli@0.14.x
        name: Install Lighthouse CLI

      - name: Run Lighthouse CI
        run: |
          CONFIG_FLAG=""
          for f in lighthouse.config.js lighthouse.config.cjs lighthouse.config.json \
                   .lighthouserc.js .lighthouserc.cjs .lighthouserc.json \
                   .lighthouserc.yml .lighthouserc.yaml; do
            if [ -f "$f" ]; then
              CONFIG_FLAG="--config=$f"
              break
            fi
          done
          lhci autorun $CONFIG_FLAG
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
